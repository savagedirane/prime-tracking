services:
  - type: web
    name: prime-crest-tracking-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # set this manually to your Supabase connection string
      - key: JWT_SECRET
        generateValue: true # Render will generate a secure random value
      - key: JWT_EXPIRES_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        sync: false # set this manually to your deployed frontend URL once you have it
