[alembic]
# Path to migration scripts, resolved relative to this file by env.py.
script_location = alembic
prepend_sys_path = .

# The URL is NOT stored here — env.py reads DATABASE_URL from the
# environment (falling back to local SQLite), so production secrets
# never live in the repo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
